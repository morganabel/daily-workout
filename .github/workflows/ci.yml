name: CI

# Validates the product on pull requests and pushes to main.
# Does NOT publish production images (that is the private deployment repo's job).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  NX_DAEMON: 'false'
  OPENSPEC_TELEMETRY: '0'

jobs:
  validate:
    name: Lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so nx can compute the affected set against the base ref.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pinned npm
        run: npm install --global --ignore-scripts npm@12.0.1

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "12.0.1"

      - name: Install dependencies
        run: npm ci

      - name: Report dependency install-script policy
        run: npm install-scripts ls

      - name: Derive base/head SHAs for affected
        uses: nrwl/nx-set-shas@v4

      - name: Check TypeScript project references are in sync
        run: npx nx sync:check

      - name: Check required Nx targets
        run: npm run validate:nx-targets

      - name: Validate OpenSpec artifacts
        run: npm run validate:openspec -- --all

      - name: Lint, typecheck, test, and build affected projects
        if: github.event_name == 'pull_request'
        run: npx nx affected -t lint,typecheck,test,build --base="$NX_BASE" --head="$NX_HEAD" --outputStyle=static

      - name: Lint, typecheck, test, and build all projects
        if: github.event_name != 'pull_request'
        run: npx nx run-many -t lint,typecheck,test,build --outputStyle=static

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f docker/Dockerfile.server -t workout-agent-server:ci .

      - name: Build migrate image
        run: docker build -f docker/Dockerfile.migrate -t workout-agent-migrate:ci .
